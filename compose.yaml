# ===========================================================================
# Podman Compose - Base de Datos Dedicada para Producción (PostgreSQL)
# ===========================================================================
name: template_hono

services:
    # ---------------------------------------------------------------------------
    # 1. Base de Datos Relacional (PostgreSQL 18)
    # ---------------------------------------------------------------------------
    db:
        image: docker.io/library/postgres:18-alpine
        restart: always
        ports:
            - '${POSTGRES_PORT:?POSTGRES_PORT es requerido}:5432'
        volumes:
            - pgdata_prod:/var/lib/postgresql
        environment:
            - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB es requerido}
            - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER es requerido}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}

# ===========================================================================
# Volúmenes Persistentes
# ===========================================================================
volumes:
    pgdata_prod:
